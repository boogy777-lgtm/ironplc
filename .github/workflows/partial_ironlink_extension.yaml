name: IronLink Extension
on:
  workflow_call:
    inputs:
      # Name deliberately avoids "ref"/"head"/"branch"/"sha"/"commit": those
      # substrings make CodeQL read the checkout below as a pull request head
      # checkout. See partial_compiler.yaml for the full explanation.
      source-revision:
        required: false
        type: string
        description: 'If not empty, then run for the specified branch name or tag'
      artifact-name:
        required: false
        type: string
        description: 'The name of the VSIX artifact to create'
      version:
        required: false
        type: string
        default: "0.0.0"
        description: "The version number, such as 1.2.3"

# Build jobs never write to the repository or a release. They only produce
# build artifacts (via actions/upload-artifact, which needs no contents:write).
# This workflow packages the extension and publishes nothing: no marketplace
# step and no credential.
# See specs/adrs/0032-ci-gating-and-secret-scoping.md.
permissions:
  contents: read

jobs:
  ironlink-extension:
    name: IronLink Extension Job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./integrations/ironlink
    steps:
      # Checkout the repository/fetch input artifacts
      - name: Checkout tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment
      - uses: taiki-e/install-action@01159adff8f38113be7211e869405f6f6abf02d7 # just
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: |
            ./integrations/ironlink/package-lock.json
            ./integrations/vscode-common/package-lock.json
          node-version-file: './integrations/ironlink/package.json'

      # Execute build recipe
      - name: Install dependencies
        run: just setup
      # The shared package is installed by `just setup` above and built by the
      # extension's own compile; this builds and tests it on its own.
      - name: Build and Test shared package
        working-directory: ./integrations/vscode-common
        run: just ci
      - name: Build and Test
        run: just ci
      - name: Create VSIX package
        run: just package ironlink-extension.vsix

      - name: Generate SBOM
        run: just sbom ${{ inputs.version }}

      # Save output artifacts. These upload only to build-artifact storage (no
      # credential required).
      - name: Upload SBOM to build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironlink-extension-sbom
          path: |
            integrations/ironlink/bom.cdx.json
            integrations/ironlink/bom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 5
      - name: Upload VSIX to build artifact
        if: ${{ inputs.artifact-name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: integrations/ironlink/ironlink-extension.vsix
          if-no-files-found: error
          retention-days: 5
