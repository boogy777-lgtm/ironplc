<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA Redundancy — dashboard + drawers</title>
<style>
  /* Composition: modern web-like desktop. Icon rail navigation, KPI card
     dashboard, slide-over drawers for detail; touch-sized targets. */
  :root { --bg:#f5f7f8; --card:#ffffff; --border:#e0e5e9; --line:#eef1f4; --text:#17242e; --muted:#5d6d79;
    --dim:#93a2ad; --accent:#0d5c8c; --accent-soft:#e3eef6; --ok:#1f8437; --warn:#9c6d00; --alarm:#c0392b; --rail:#12212d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#aab4bc; color:var(--text); font:13.5px/1.5 "Segoe UI", system-ui, sans-serif; }
  .mono, .ha-num, .ha-t, .v { font-family:Consolas, "Courier New", monospace; }
  .ha-app { position:absolute; inset:6px; display:flex; flex-direction:column; background:var(--bg); border:1px solid #8d98a1;
    box-shadow:0 12px 40px rgba(0,0,0,.35); overflow:hidden; }
  .ha-titlebar { display:flex; align-items:center; height:30px; padding:0 4px 0 12px; background:#fff; border-bottom:1px solid var(--border); }
  .ha-appicon { width:17px; height:17px; margin-right:8px; background:var(--accent); border-radius:4px; color:#fff; text-align:center; line-height:17px; font-size:10px; }
  .ha-titletext { flex:1; }
  .ha-winbtn { width:40px; height:22px; background:transparent; border:none; color:#5d6d79; font-size:11px; }
  .ha-winbtn:hover { background:#e8edf0; } .ha-winbtn.close:hover { background:var(--alarm); color:#fff; }
  .ha-body { flex:1; display:flex; min-height:0; }
  .rail { width:72px; background:var(--rail); display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 0; }
  .rail button { width:58px; padding:9px 2px; background:transparent; border:none; border-radius:8px; color:#9fb0bd;
    font:inherit; font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rail button .g { font-size:18px; }
  .rail button:hover { background:#1b3142; color:#fff; }
  .rail button.active { background:var(--accent); color:#fff; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 18px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .topbar h1 { margin:0; font-size:17px; flex:1; }
  .topbar .sub { color:var(--muted); font-size:12px; }
  .tbtn { display:flex; align-items:center; gap:7px; min-height:44px; padding:9px 17px; border-radius:8px;
    border:1px solid var(--border); background:#fff; color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .tbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .tbtn:disabled { opacity:.45; cursor:not-allowed; }
  .tbtn.primary { background:var(--accent); border-color:#0a4a71; color:#fff; }
  .tbtn.primary:hover:not(:disabled) { background:#0a4a71; color:#fff; }
  .tbtn.warn { background:#fdf6e3; border-color:#d9b45a; color:#7a5200; }
  .tbtn.danger { background:#fdeeec; border-color:#d99a90; color:#8f2318; }
  .content { flex:1; overflow:auto; padding:18px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(255px, 1fr)); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; cursor:pointer;
    box-shadow:0 1px 3px rgba(20,35,45,.06); transition:box-shadow .15s, transform .15s; }
  .kpi:hover { box-shadow:0 8px 22px rgba(20,35,45,.14); transform:translateY(-1px); }
  .kpi .cap { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .kpi .cap .g { font-size:17px; color:var(--accent); }
  .kpi .value { font-size:26px; font-weight:700; margin-top:8px; }
  .kpi .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .kpi .chip { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--border); border-radius:12px;
    padding:3px 11px; font-size:11.5px; color:var(--muted); margin-top:9px; }
  .kpi .chip.ok { border-color:var(--ok); color:var(--ok); } .kpi .chip.warn { border-color:#d9b45a; color:var(--warn); }
  .kpi .chip.alarm { border-color:#d99a90; color:var(--alarm); }
  .kpi .dot { width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
  .overlay { position:absolute; inset:0; background:rgba(15,28,38,.35); opacity:0; pointer-events:none; transition:opacity .2s; }
  .overlay.on { opacity:1; pointer-events:auto; }
  .drawer { position:absolute; top:0; right:0; bottom:0; width:430px; max-width:92%; background:#fff; border-left:1px solid var(--border);
    box-shadow:-12px 0 34px rgba(15,28,38,.22); transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer .dhead { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .drawer .dhead h2 { margin:0; font-size:16px; flex:1; }
  .drawer .dclose { width:40px; height:40px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:16px; cursor:pointer; }
  .drawer .dclose:hover { border-color:var(--alarm); color:var(--alarm); }
  .drawer .dbody { flex:1; overflow:auto; padding:16px; }
  .drawer .dfoot { padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }
  .ha-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:13px; margin-bottom:12px; }
  .ha-card h3 { margin:0 0 9px 0; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); }
  .ha-kv { display:grid; grid-template-columns:168px 1fr; gap:4px 10px; }
  .ha-kv .k { color:var(--muted); } .ha-kv .v { color:#17242e; }
  .ha-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .ha-chip { font-size:10.5px; padding:2px 9px; border-radius:10px; border:1px solid var(--border); background:#f4f6f8; color:#9aa8b3; font-family:Consolas, monospace; }
  .ha-chip.on { background:var(--accent-soft); border-color:var(--accent); color:#0a4a71; }
  .ha-chip.on.ok { background:#e2f3e7; border-color:var(--ok); color:#155c2d; }
  .ha-chip.on.warn { background:#faf0cf; border-color:#d9b45a; color:#7a5200; }
  .ha-chip.on.alarm { background:#f9e0dd; border-color:#d99a90; color:#8f2318; }
  .ha-table { width:100%; border-collapse:collapse; }
  .ha-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:5px 6px; border-bottom:2px solid var(--accent); }
  .ha-table td { padding:4px 6px; border-bottom:1px solid var(--line); font-family:Consolas, monospace; font-size:12px; }
  .ha-table tr.limit td { background:#fdf6e2; color:#7a5200; }
  .ha-table tr.limit td:first-child::after { content:" ← limiting"; font-size:9.5px; color:var(--warn); }
  .ha-num { text-align:right; }
  .ha-check { width:17px; height:17px; accent-color:var(--accent); }
  .ha-pill { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--border); background:#fff;
    border-radius:12px; padding:4px 12px; color:var(--muted); font-size:11.5px; }
  .ha-pill b { color:var(--text); }
  .ha-pill.ok { border-color:var(--ok); color:var(--ok); } .ha-pill.ok b { color:var(--ok); }
  .ha-pill.warn { border-color:#d9b45a; color:var(--warn); } .ha-pill.warn b { color:var(--warn); }
  .ha-pill.alarm { border-color:#d99a90; color:var(--alarm); } .ha-pill.alarm b { color:var(--alarm); }
  .ha-dot { width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
  .ha-progress { height:11px; background:#e8edf0; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-top:9px; }
  .ha-bar { height:100%; background:var(--accent); width:0; transition:width .2s; }
  .ha-bar.ok { background:var(--ok); } .ha-bar.warn { background:#d9b45a; }
  .ha-formula { background:var(--accent-soft); border:1px solid #c4dced; border-radius:8px; padding:10px 12px; color:#0a4a71; font-family:Consolas, monospace; font-size:12px; }
  .ha-verdict { display:inline-flex; gap:8px; align-items:center; border-radius:8px; padding:8px 13px; border:1px solid; font-weight:600; }
  .ha-verdict.ok { border-color:var(--ok); color:var(--ok); background:#e7f5ec; }
  .ha-verdict.alarm { border-color:var(--alarm); color:var(--alarm); background:#fbe9e7; }
  .ha-log { max-height:420px; overflow:auto; border:1px solid var(--border); border-radius:8px; }
  .ha-lrow { display:grid; grid-template-columns:104px 58px 1fr; gap:8px; padding:5px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  .ha-lrow:nth-child(even) { background:#f8fafb; }
  .ha-t { color:var(--dim); font-size:11px; }
  .ha-sev { font-size:10px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .ha-sev.info { color:var(--accent); } .ha-sev.warn { color:var(--warn); } .ha-sev.alarm { color:var(--alarm); }
  .ha-msg { color:#22303c; }
  .ha-note { color:var(--muted); font-size:12px; margin:8px 0 0 0; }
  .ha-hint { color:var(--dim); font-size:11.5px; }
  .ha-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ha-input { background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 9px; font:inherit; min-width:86px; min-height:38px; }
  .ha-btn { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 14px; font:inherit; min-height:40px; cursor:pointer; }
  .ha-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .ha-btn:disabled { opacity:.5; cursor:not-allowed; }
  .ha-btn.primary { background:var(--accent); border-color:#0a4a71; color:#fff; }
  .ha-btn.warn { background:#fdf6e3; border-color:#d9b45a; color:#7a5200; }
  .ha-btn.danger { background:#fdeeec; border-color:#d99a90; color:#8f2318; }
  .ha-statusbar { display:flex; gap:9px; align-items:center; height:26px; padding:0 16px; background:#fff;
    border-top:1px solid var(--border); color:#3c4b58; font-size:11.5px; }
  .ha-sep { color:#c2ccd3; }
  .ha-ok { color:var(--ok); } .ha-warn { color:var(--warn); } .ha-alarm { color:var(--alarm); } .ha-muted { color:var(--muted); }
</style>
</head>
<body>
<div class="ha-app">
  <div class="ha-titlebar"><span class="ha-appicon">&#9670;</span><span class="ha-titletext">IronPLC Engineering — PAIR-RB-0417</span>
    <span><button class="ha-winbtn" tabindex="-1">&#9472;</button><button class="ha-winbtn" tabindex="-1">&#9723;</button><button class="ha-winbtn close" tabindex="-1">&#10005;</button></span></div>
  <div class="ha-body">
    <div class="rail" id="rail"></div>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content" id="content"></div>
    </div>
    <div class="overlay" id="overlay" onclick="app.close()"></div>
    <div class="drawer" id="drawer"><div class="dhead"><h2 id="dtitle">Details</h2>
      <button class="dclose" onclick="app.close()" aria-label="Close">&#10005;</button></div>
      <div class="dbody" id="dbody"></div><div class="dfoot" id="dfoot"></div></div>
  </div>
  <div class="ha-statusbar" id="status"></div>
</div>

<script src="mockup-core.js"></script>
<script>
(function () {
  'use strict';
  var ui = { drawer: null };
  function el(id) { return document.getElementById(id); }
  function esc(s) { return HA.esc(s); }
  var S = HA.getState;

  HA.mount({ surface: 'portal', inspector: false });

  function renderRail() {
    var items = [['dashboard', 'Dashboard', '\u25A6'], ['pair', 'Pair', '\u25A3'], ['calibration', 'Calibration', '\u223F'],
      ['program', 'Program', '\u25A4'], ['ownership', 'Ownership', '\u25CB'], ['timing', 'Timing', '\u03A3'], ['alarms', 'Alarms', '\u2315']];
    var alarms = HA.derive.alarmsActive();
    el('rail').innerHTML = items.map(function (it) {
      var label = it[1] + (it[0] === 'alarms' && alarms ? ' (' + alarms + ')' : '');
      return '<button class="' + (ui.drawer === it[0] ? 'active' : '') + '" onclick="app.open(\'' + it[0] + '\')">' +
        '<span class="g">' + it[2] + '</span>' + esc(label) + '</button>';
    }).join('');
  }

  function renderTopbar() {
    var st = S();
    var b = st.busy ? 'disabled' : '';
    el('topbar').innerHTML = '<h1>Redundant Pair</h1><span class="sub">PAIR-RB-0417 · epoch ' + st.epoch + '</span>' +
      '<button class="tbtn primary" ' + b + ' onclick="app.open(\'takeover\')">&#8646; Takeover</button>' +
      '<button class="tbtn" ' + b + ' onclick="HA.act(\'calibrate\')">&#9654; Calibrate</button>' +
      '<button class="tbtn warn" ' + b + ' onclick="HA.act(\'degrade\')">&#9888; ' + (st.degraded ? 'Restore link' : 'Degrade link') + '</button>' +
      '<button class="tbtn" ' + b + ' onclick="HA.setMode(\'' + (st.mode === 'redundant' ? 'standalone' : 'redundant') + '\')">' +
      (st.mode === 'redundant' ? 'Stop pair' : 'Start pair') + '</button>' +
      '<button class="tbtn" ' + b + ' onclick="HA.act(\'reset\')">&#8634; Reset</button>';
  }

  function kpi(cap, glyph, value, sub, chip, chipTone, drawer) {
    return '<div class="kpi" tabindex="0" onclick="app.open(\'' + drawer + '\')" onkeydown="app.key(event,\'' + drawer + '\')">' +
      '<div class="cap"><span class="g">' + glyph + '</span>' + esc(cap) + '</div>' +
      '<div class="value">' + esc(value) + '</div><div class="sub">' + esc(sub) + '</div>' +
      '<div class="chip ' + chipTone + '"><span class="dot"></span>' + esc(chip) + '</div></div>';
  }

  function renderDash() {
    var st = S(), d = HA.data.overview(), b = HA.data.barrier(), t = HA.data.timing(), c = HA.data.calibration();
    var link = st.link.ch1 === 'OK' && st.link.ch2 === 'OK' ? 'healthy' : (HA.derive.linkValid() ? 'degraded' : 'lost');
    var h = '<div class="kpis">' +
      kpi('Pair health', '\u25A3', st.permitOwner || '—', (st.mode === 'redundant' ? 'redundant' : 'standalone') + ' · ' + link + ' link',
        (st.mode === 'redundant' && st.permitOwner) ? 'permit granted' : 'check required', (st.permitOwner ? 'ok' : 'alarm'), 'pair') +
      kpi('Takeover readiness', '\u2691', d.takeoverReady ? 'READY' : 'NOT READY', 'calibration: ' + c.cal.state.toLowerCase(),
        d.takeoverReady ? 'takeover permitted' : 'preconditions open', d.takeoverReady ? 'ok' : 'warn', 'takeover') +
      kpi('Ownership barrier', '\u25CB', b.claimed + '/' + b.total, 'limiting ' + b.limitingId,
        b.passed ? 'barrier passed' : 'in progress', b.passed ? 'ok' : 'warn', 'ownership') +
      kpi('Timing budget', '\u03A3', HA.f2(t.worst) + ' ms', 'predicted now ' + HA.f2(t.predicted) + ' ms',
        t.ok ? 'qualified' : 'minimum ' + HA.f2(t.worst) + ' ms', t.ok ? 'ok' : 'alarm', 'timing') +
      kpi('Calibration', '\u223F', HA.f2(c.directions[1].e10) + ' ms', 'CH2 EMA10 · jitter ' + HA.f2(c.jitter) + ' ms',
        c.cal.state.toLowerCase(), c.cal.state === 'CALIBRATED' ? 'ok' : 'warn', 'calibration') +
      kpi('Alarms', '\u2315', String(HA.derive.alarmsActive()), 'event ring ' + HA.data.events('all').length + ' entries',
        HA.derive.alarmsActive() ? 'attention' : 'none active', HA.derive.alarmsActive() ? 'alarm' : 'ok', 'alarms') +
      '</div>';
    h += '<p class="ha-note">Tap a card for details in the drawer. Common actions are on the top bar; every drawer holds the detailed tables and the actions for its area.</p>';
    el('content').innerHTML = h;
  }

  function drawerBody(name) {
    var st = S();
    if (name === 'program') {
      return '<div class="ha-card"><h3>Main — monitoring / online edit</h3>' + HA.edit.sectionHtml() + '</div>';
    }
    if (name === 'pair') {
      var d = HA.data.overview();
      return '<div class="ha-card"><h3>Pair</h3>' + HA.frag.kv([['PairId', d.pairId], ['Epoch', String(d.epoch)],
        ['Application generation', String(d.appGen)], ['Committed state generation', String(d.stateGen)],
        ['Permit', esc(d.permit || 'WITHHELD'), d.permit ? 'ha-ok' : 'ha-alarm']]) + '</div>' +
        '<div class="ha-card"><h3>Units</h3>' + d.units.map(function (u) {
          return '<div style="margin-bottom:9px">' + HA.frag.kv([[u.name, esc(u.role) + ' · ' + esc(u.ip)],
            ['CONTROL', u.control, u.control === 'ACTIVE' ? 'ha-ok' : 'ha-muted']]) + '<div class="ha-chips">' + HA.frag.syncChips(u.name) + '</div></div>';
        }).join('') + '</div>' +
        '<div class="ha-card"><h3>Ping/Pong</h3>' + counters() + '</div>' +
        '<div class="ha-card"><h3>Failure &amp; recovery</h3>' +
        '<div class="ha-row"><span class="ha-hint">Channels:</span>' +
        '<button class="ha-btn danger" ' + (HA.derive.can('kill-p') ? '' : 'disabled') + ' onclick="HA.act(\'kill-p\')">Kill P</button>' +
        '<button class="ha-btn danger" ' + (HA.derive.can('kill-i') ? '' : 'disabled') + ' onclick="HA.act(\'kill-i\')">Kill I</button>' +
        '<button class="ha-btn" ' + (HA.derive.can('restore-channels') ? '' : 'disabled') + ' onclick="HA.act(\'restore-channels\')">Restore</button></div>' +
        '<div class="ha-row" style="margin-top:8px"><span class="ha-hint">Units:</span>' +
        '<button class="ha-btn danger" ' + (HA.derive.can('death') ? '' : 'disabled') + ' onclick="HA.act(\'death\')">Primary death</button>' +
        '<button class="ha-btn danger" ' + (HA.derive.can('death-secondary') ? '' : 'disabled') + ' onclick="HA.act(\'death-secondary\')">Secondary death</button>' +
        '<button class="ha-btn" ' + (HA.derive.can('resurrect-primary') ? '' : 'disabled') + ' onclick="HA.act(\'resurrect-primary\')">Resurrect primary</button>' +
        '<button class="ha-btn" ' + (HA.derive.can('resurrect-secondary') ? '' : 'disabled') + ' onclick="HA.act(\'resurrect-secondary\')">Resurrect secondary</button></div></div>';
    }
    if (name === 'takeover') {
      var ov = HA.data.overview();
      return '<div class="ha-card"><h3>TakeoverReady</h3>' + HA.frag.kv(ov.trInputs.map(function (i) {
        return [i.label, i.ok ? 'true' : 'false', i.ok ? 'ha-ok' : 'ha-muted'];
      })) + '<div style="margin-top:10px">' + (ov.takeoverReady
        ? '<span class="ha-verdict ok"><span class="ha-dot"></span>TAKEOVER READY</span>'
        : '<span class="ha-verdict alarm"><span class="ha-dot"></span>NOT READY</span>') + '</div></div>' +
        '<div class="ha-card"><h3>Paths</h3><p class="ha-note">Commanded swap: old owner releases, new owner claims all modules (CLAIMED_DISARMED), barrier, epoch bump, ARM. Uncontrolled: lease expiry then the same barrier. Partition: P=false && I=false with a live owner — the claim is rejected (OWNERSHIP_CONFLICT) and the pair lands in REDUNDANCY_LOST.</p>' +
        '<div class="ha-row" style="margin-top:10px"><button class="ha-btn danger" ' + (HA.derive.can('death') ? '' : 'disabled') + ' onclick="HA.act(\'death\')">Simulate primary death</button>' +
        '<button class="ha-btn warn" ' + (HA.derive.can('partition') ? '' : 'disabled') + ' onclick="HA.act(\'partition\')">Partition claim (owner alive)</button></div></div>';
    }
    if (name === 'calibration') {
      var c = HA.data.calibration();
      return '<div class="ha-card"><h3>Link profile</h3>' + HA.frag.table(['direction', 'current', 'EMA10', 'EMA100', 'max'], c.directions.map(function (r) {
        return { cells: [r.dir, HA.f2(r.cur), HA.f2(r.e10), HA.f2(r.e100), HA.f2(r.max)] };
      })) + HA.frag.kv([['Jitter', HA.f2(c.jitter) + ' ms'], ['Loss', (c.loss * 100).toFixed(4) + ' %']]) + '</div>' +
        '<div class="ha-card"><h3>Recalibration</h3><p class="ha-note">Requalification is required when NIC, medium, link speed, topology, runtime, or HA protocol change.</p>' +
        '<div class="ha-row" style="margin-top:10px"><button class="ha-btn warn" ' + (st.busy ? 'disabled' : '') + ' onclick="HA.act(\'invalidate-nic\')">Invalidate (NIC)</button>' +
        '<button class="ha-btn warn" ' + (st.busy ? 'disabled' : '') + ' onclick="HA.act(\'invalidate-topo\')">Invalidate (topology)</button></div></div>';
    }
    if (name === 'ownership') {
      var b = HA.data.barrier();
      return '<div class="ha-card"><h3>Modules</h3><table class="ha-table"><thead><tr><th></th><th>module</th><th>owner</th><th>state</th><th>claim ms</th><th>T ms</th></tr></thead><tbody>' +
        b.modules.map(function (m) {
          var tone = m.ownerState === 'ARMED' ? 'ha-ok' : (m.ownerState === 'CLAIMED_DISARMED' ? 'ha-warn' : 'ha-alarm');
          var picked = b.selection.indexOf(m.id) >= 0;
          return '<tr class="' + (m.limiting ? 'limit ' : '') + '"><td><input type="checkbox" class="ha-check" ' + (picked ? 'checked' : '') + ' onchange="app.row(\'' + m.id + '\')"></td>' +
            '<td>' + m.id + '</td><td>' + esc(m.owner) + '</td><td class="' + tone + '">' + m.ownerState + '</td>' +
            '<td class="ha-num">' + HA.f2(m.claim) + '</td><td class="ha-num">' + HA.f2(m.claimMax) + '</td></tr>';
        }).join('') + '</tbody></table><p class="ha-note">Selection: ' + b.selection.length + ' module(s). Claim → DISARMED; ARM only after the barrier.</p></div>';
    }
    if (name === 'timing') {
      var t = HA.data.timing();
      return '<div class="ha-formula">T_recovery = T_peer-detect + T_claim + T_arm + T_scan-safe-point + T_output-apply</div>' +
        '<div class="ha-card" style="margin-top:12px"><h3>Terms</h3>' + HA.frag.table(['term', 'measured', 'bound'], t.terms.map(function (r) {
          return { cells: [r.name, HA.f2(r.measured), HA.f2(r.bound)] };
        })) + '</div><div class="ha-card"><h3>Requirements</h3><div class="ha-row">' +
        '<input class="ha-input" type="number" step="0.5" id="haConfInp" value="' + t.confirmation + '">' +
        '<input class="ha-input" type="number" step="1" id="haBudgetInp" value="' + t.budget + '">' +
        '<button class="ha-btn primary" onclick="HA.act(\'apply-budget\')">Apply</button></div>' +
        '<p class="ha-note">Worst case ' + HA.f2(t.worst) + ' ms; predicted now ' + HA.f2(t.predicted) + ' ms.</p></div>';
    }
    return '<div class="ha-card"><h3>Event ring</h3><div class="ha-log">' + HA.data.events('all').map(function (e) {
      return '<div class="ha-lrow"><span class="ha-t">' + esc(e.t) + '</span><span class="ha-sev ' + e.sev + '">' + e.sev + '</span><span class="ha-msg">' + esc(e.msg) + '</span></div>';
    }).join('') + '</div></div>';
  }

  function counters() {
    var st = S();
    function row(name, c, state) {
      return { cells: [name, c.ping.toLocaleString() + ' / ' + c.pong.toLocaleString() + ' (+1)', c.missing + ' → ' + c.penalty.toLocaleString(), state] };
    }
    return HA.frag.table(['channel', 'ping / pong', 'missing (×1000)', 'state'], [row('CH1', st.counters.ch1, st.link.ch1), row('CH2', st.counters.ch2, st.link.ch2)]);
  }

  function drawerFoot(name) {
    var st = S();
    var b = st.busy ? 'disabled' : '';
    if (name === 'takeover') {
      return '<button class="ha-btn primary" style="min-height:46px" ' + b + ' onclick="HA.act(\'swap\')">Execute commanded swap</button>';
    }
    if (name === 'ownership') {
      return '<button class="ha-btn primary" ' + (HA.data.barrier().selection.length && !st.busy ? '' : 'disabled') + ' onclick="HA.bulk(\'claim\')">Claim selected</button>' +
        '<button class="ha-btn warn" ' + (HA.data.barrier().selection.length && !st.busy ? '' : 'disabled') + ' onclick="HA.bulk(\'release\')">Release selected</button>' +
        '<button class="ha-btn" ' + (HA.data.barrier().selection.length && !st.busy ? '' : 'disabled') + ' onclick="HA.bulk(\'arm\')">ARM selected</button>';
    }
    if (name === 'calibration') {
      return '<button class="ha-btn primary" ' + b + ' onclick="HA.act(\'calibrate\')">Run calibration</button>';
    }
    return '';
  }

  function renderDrawer() {
    var open = !!ui.drawer;
    el('drawer').className = 'drawer' + (open ? ' open' : '');
    el('overlay').className = 'overlay' + (open ? ' on' : '');
    if (!open) return;
    var titles = { pair: 'Pair', takeover: 'Takeover', calibration: 'Calibration', program: 'Program', ownership: 'Ownership & Barrier', timing: 'Timing Budget', alarms: 'Alarms & Events' };
    el('dtitle').textContent = titles[ui.drawer] || 'Details';
    el('dbody').innerHTML = drawerBody(ui.drawer);
    el('dfoot').innerHTML = drawerFoot(ui.drawer);
  }

  function renderStatus() {
    var st = S();
    var n = HA.derive.alarmsActive();
    el('status').innerHTML = '<span>' + (st.mode === 'redundant' ? 'Redundant pair' : 'Standalone') + '</span><span class="ha-sep">|</span>' +
      '<span>epoch ' + st.epoch + '</span><span class="ha-sep">|</span><span>permit ' + esc(st.permitOwner || 'WITHHELD') + '</span><span class="ha-sep">|</span>' +
      '<span class="' + (n ? 'ha-alarm' : 'ha-ok') + '">' + (n ? n + ' alarm(s)' : 'no alarms') + '</span><span class="ha-sep">|</span><span>touch-ready targets</span>' +
      '<span class="ha-sep">|</span><span>' + HA.edit.statusText() + '</span>';
  }

  function render(tick) {
    if (tick && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    renderRail(); renderTopbar(); renderDash(); renderDrawer(); renderStatus();
  }

  window.app = {
    open: function (name) { ui.drawer = name; render(false); },
    close: function () { ui.drawer = null; render(false); },
    key: function (ev, name) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); app.open(name); } },
    row: function (id) { HA.select.toggle(id); render(false); }
  };

  HA.subscribe(function (tick) { render(tick); });
  render(false);
})();
</script>
</body>
</html>
