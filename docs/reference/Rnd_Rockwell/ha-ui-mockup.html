<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronPLC — Redundancy Engineering UI (mockup)</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121820;
    --panel2: #0e141c;
    --border: #263140;
    --text: #d5dde8;
    --muted: #7d8b9c;
    --dim: #4a5666;
    --ok: #3fb950;
    --ok-dim: #1b3a25;
    --warn: #d29922;
    --warn-dim: #3a2f14;
    --alarm: #f85149;
    --alarm-dim: #3d1b1a;
    --accent: #58a6ff;
    --accent-dim: #14283f;
    --chip: #1b2430;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 14px; }
  .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
  .app { max-width: 1280px; margin: 0 auto; padding: 14px 18px 40px 18px; }

  .titlebar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .titlebar h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .titlebar .sub { color: var(--muted); font-size: 12px; }

  .status-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--chip);
    border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px;
    font-size: 12px; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.ok b { color: var(--ok); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.warn b { color: var(--warn); }
  .pill.alarm { border-color: var(--alarm); color: var(--alarm); }
  .pill.alarm b { color: var(--alarm); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

  .config-bar { display: grid; grid-template-columns: auto 1fr auto 1fr auto auto; gap: 10px 14px;
    align-items: end; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .field select, .field input[type="text"], .field input[type="number"] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 8px; font-size: 13px; font-family: inherit; min-width: 120px; }
  .field select:focus, .field input:focus { outline: 1px solid var(--accent); }
  .field .unit { color: var(--dim); font-size: 11px; }

  .demobar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .demobar .tag { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; margin-right: 2px; }
  button { background: #1f2a38; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { border-color: #2f5f9e; background: #17324f; color: #9ecbff; }
  button.warn { border-color: #6b5312; background: #33290e; color: #e8c766; }
  button.danger { border-color: #7a2f2a; background: #3a1c1a; color: #ff9d97; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tabs button { background: transparent; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 9px 16px; color: var(--muted); font-size: 13px; }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .badge { background: var(--alarm); color: #fff; border-radius: 9px; font-size: 10px;
    padding: 1px 6px; margin-left: 6px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.7px; }
  .card .kv { display: grid; grid-template-columns: 168px 1fr; gap: 3px 10px; font-size: 13px; }
  .card .kv .k { color: var(--muted); }
  .card .kv .v { font-family: "Cascadia Mono", Consolas, monospace; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: var(--chip);
    border: 1px solid var(--border); color: var(--dim); font-family: "Cascadia Mono", Consolas, monospace; }
  .chip.on { color: #fff; border-color: var(--accent); background: var(--accent-dim); }
  .chip.on.ok { border-color: var(--ok); background: var(--ok-dim); color: var(--ok); }
  .chip.on.warn { border-color: var(--warn); background: var(--warn-dim); color: var(--warn); }
  .chip.on.alarm { border-color: var(--alarm); background: var(--alarm-dim); color: var(--alarm); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.6px; padding: 7px 9px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 9px; border-bottom: 1px solid #1a2430; font-family: "Cascadia Mono", Consolas, monospace; }
  tr.limit td { background: #2a2110; color: #e8c766; }
  tr.limit td:first-child::after { content: " ← limiting"; color: var(--warn); font-size: 10px; font-family: inherit; }
  .num { text-align: right; }
  .ok-t { color: var(--ok); }
  .warn-t { color: var(--warn); }
  .alarm-t { color: var(--alarm); }
  .muted-t { color: var(--muted); }

  .progress { height: 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, #1f6feb, #58a6ff); width: 0%; transition: width 0.2s; }
  .progress .bar.ok { background: linear-gradient(90deg, #238636, #3fb950); }
  .progress .bar.warn { background: linear-gradient(90deg, #9e6a03, #d29922); }

  .formula { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; color: #9ecbff; }
  .verdict { display: inline-flex; align-items: center; gap: 8px; border-radius: 6px; padding: 7px 12px;
    font-weight: 600; font-size: 13px; border: 1px solid; }
  .verdict.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-dim); }
  .verdict.alarm { color: var(--alarm); border-color: var(--alarm); background: var(--alarm-dim); }
  .verdict.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-dim); }

  .log { max-height: 460px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .log .row { display: grid; grid-template-columns: 116px 76px 1fr; gap: 10px; padding: 6px 12px;
    border-bottom: 1px solid #1a2430; font-size: 12.5px; align-items: baseline; }
  .log .t { color: var(--dim); font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
  .log .sev { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 700; }
  .log .sev.info { color: var(--accent); }
  .log .sev.warn { color: var(--warn); }
  .log .sev.alarm { color: var(--alarm); }
  .log .msg { color: var(--text); }

  .note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .hint { color: var(--dim); font-size: 11.5px; }
  .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .slider-row input[type="range"] { flex: 1; accent-color: #58a6ff; }
  .standalone-dim { opacity: 0.45; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <h1>IronPLC Redundancy — Engineering Console</h1>
    <span class="sub">mockup · contract: specs/design/ha-engineering-ui.md</span>
  </div>

  <div id="statusStrip" class="status-strip"></div>

  <div class="config-bar">
    <div class="field">
      <label>Mode</label>
      <select id="modeSel" onchange="demo.setMode(this.value)">
        <option value="redundant">Redundant pair</option>
        <option value="standalone">Standalone</option>
      </select>
    </div>
    <div class="field">
      <label>PLC-1 configured role</label>
      <select id="role1Sel" onchange="demo.setRole(1, this.value)">
        <option value="Primary">Primary</option>
        <option value="Secondary">Secondary</option>
      </select>
    </div>
    <div class="field">
      <label>PLC-1 IP</label>
      <input id="ip1Inp" type="text" value="192.168.10.11" onchange="demo.setIp(1, this.value)">
    </div>
    <div class="field">
      <label>PLC-2 configured role</label>
      <select id="role2Sel" onchange="demo.setRole(2, this.value)">
        <option value="Secondary">Secondary</option>
        <option value="Primary">Primary</option>
      </select>
    </div>
    <div class="field">
      <label>PLC-2 IP</label>
      <input id="ip2Inp" type="text" value="192.168.10.12" onchange="demo.setIp(2, this.value)">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <span class="hint">port 1 pair link · port 2 I/O chain</span>
    </div>
  </div>

  <div id="demoBar" class="demobar"></div>
  <div id="tabsBar" class="tabs"></div>

  <div id="panel-overview" class="panel active"></div>
  <div id="panel-calibration" class="panel"></div>
  <div id="panel-barrier" class="panel"></div>
  <div id="panel-timing" class="panel"></div>
  <div id="panel-events" class="panel"></div>
</div>

<script>
(function () {
  'use strict';

  var P1 = 'PLC-1';
  var P2 = 'PLC-2';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function f2(n) { return Number(n).toFixed(2); }
  function stamp() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
      ':' + String(d.getSeconds()).padStart(2, '0') + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  var MODULES = [
    { id: 'DO-01', profile: 'preconnected', claim: 0.72, claimMax: 1.74 },
    { id: 'DO-02', profile: 'preconnected', claim: 0.68, claimMax: 1.68 },
    { id: 'DO-03', profile: 'preconnected', claim: 0.81, claimMax: 1.91 },
    { id: 'DO-04', profile: 'preconnected', claim: 0.74, claimMax: 1.83 },
    { id: 'DO-05', profile: 'preconnected', claim: 0.69, claimMax: 1.70 },
    { id: 'DO-06', profile: 'preconnected', claim: 0.77, claimMax: 1.79 },
    { id: 'DO-07', profile: 'reconnect',    claim: 1.41, claimMax: 8.40 },
    { id: 'DO-08', profile: 'preconnected', claim: 0.70, claimMax: 1.72 }
  ];

  function freshState() {
    return {
      mode: 'redundant',
      busy: false,
      tab: 'overview',
      eventsFilter: 'all',
      plc: {
        1: { role: 'Primary', ip: '192.168.10.11' },
        2: { role: 'Secondary', ip: '192.168.10.12' }
      },
      admission: 'ADMITTED',           // ADMITTED | CALIBRATING | UNQUALIFIED | STANDALONE
      permitOwner: P1,
      epoch: 41,
      appGen: 105,
      stateGen: 1842,
      sync: makeMap('SYNC_READY', 'SYNC_READY'),
      control: makeMap('ACTIVE', 'IDLE'),
      online: makeMap(true, true),
      link: { ch1: 'OK', ch2: 'OK' },
      degraded: false,
      timingLost: false,
      redundancyLost: false,
      calibration: 'CALIBRATED',       // UNQUALIFIED | CALIBRATING | CALIBRATED
      calProgress: 100,
      calBaseline: '2026-09-16 09:14:22',
      calTrigger: 'commissioning',
      counters: {
        ch1: { ping: 120304, pong: 120304, missing: 0, penalty: 0 },
        ch2: { ping: 120304, pong: 120304, missing: 0, penalty: 0 }
      },
      scanPhase: 0.62,
      scan: { ema10: 7.40, ema100: 7.10, max: 11.80, jitter: 0.62 },
      config: { confirmationMs: 5.0, budgetMs: 40.0 },
      modules: MODULES.map(function (m, i) {
        return {
          id: m.id, profile: m.profile, claim: m.claim, claimMax: m.claimMax,
          owner: P1, ownerEpoch: 41, ownerState: 'ARMED', armed: true, outSeq: 9000 + i * 17, packetAgeUs: 180 + i * 9
        };
      }),
      barrier: { claimed: 8, total: 8, passed: true },
      events: []
    };
  }

  function makeMap(a, b) { var o = {}; o[P1] = a; o[P2] = b; return o; }

  var state = freshState();

  function seedEvents() {
    var base = Date.now() - 90000;
    function at(off, sev, msg) {
      var d = new Date(base + off);
      return { t: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
        ':' + String(d.getSeconds()).padStart(2, '0') + '.' + String(d.getMilliseconds()).padStart(3, '0'),
        sev: sev, msg: msg };
    }
    state.events = [
      at(86000, 'info', 'ping/pong boot: pair found on port 1 — admission complete, permit granted to ' + P1),
      at(60000, 'info', 'commissioning calibration complete — HA link profile accepted (QUALIFIED)'),
      at(42000, 'info', 'claim/ARM epoch 41 — ' + P1 + ' ACTIVE, 8/8 required modules ARMED'),
      at(12000, 'warn', 'channel 2 (I/O chain) jitter envelope widened briefly — within calibration'),
      at(3000, 'info', 'ping/pong healthy on both channels (ch1 pair link, ch2 I/O chain)'),
      at(-40000, 'alarm', 'previous boot: REDUNDANCY_LOST — cleared by manual repair and requalification')
    ];
  }

  function addEvent(sev, msg) {
    state.events.unshift({ t: stamp(), sev: sev, msg: msg });
    if (state.events.length > 160) state.events.pop();
  }

  // ---------- derived ----------
  function activeUnit() { return state.control[P1] === 'ACTIVE' ? P1 : (state.control[P2] === 'ACTIVE' ? P2 : null); }
  function standbyUnit() { var a = activeUnit(); return a === P1 ? P2 : (a === P2 ? P1 : null); }
  function linkValid() { return state.link.ch1 === 'OK' || state.link.ch2 === 'OK'; }
  function ioReady() { return state.mode === 'redundant' && state.link.ch1 !== 'LOST' && !state.redundancyLost; }
  function takeoverReady(unit) {
    if (state.mode !== 'redundant') return false;
    if (state.calibration !== 'CALIBRATED') return false;
    if (state.redundancyLost) return false;
    if (unit !== standbyUnit()) return false;
    return state.sync[unit] === 'SYNC_READY' && ioReady() && linkValid();
  }
  function claimMaxNow() { return state.degraded ? 24.10 : 20.77; }
  function claimEmaNow() { return state.degraded ? 7.90 : 6.52; }
  function outputMaxNow() { return state.degraded ? 0.90 : 0.60; }
  function outputEmaNow() { return state.degraded ? 0.36 : 0.31; }
  function budgetCheck() {
    var worst = state.config.confirmationMs + claimMaxNow() + state.scan.max + outputMaxNow();
    return { worst: worst, ok: worst <= state.config.budgetMs + 1e-9 };
  }
  function predictedNow() {
    var remaining = (1 - state.scanPhase) * state.scan.ema10;
    return state.config.confirmationMs + claimEmaNow() + 0.42 + remaining + outputEmaNow();
  }
  function alarmsActive() {
    var n = 0;
    if (state.degraded) n++;
    if (state.timingLost) n++;
    if (state.redundancyLost) n++;
    return n;
  }

  // ---------- rendering ----------
  function chip(label, on, tone) {
    return '<span class="chip' + (on ? ' on ' + (tone || '') : '') + '">' + esc(label) + '</span>';
  }
  function syncChips(unit) {
    var cur = state.sync[unit];
    return ['deSYNC', 'SYNCING', 'SYNC_READY'].map(function (s) {
      var tone = s === 'SYNC_READY' ? 'ok' : 'warn';
      return chip(s, cur === s, tone);
    }).join('');
  }
  function controlChips(unit) {
    var cur = state.control[unit];
    if (!state.online[unit]) cur = 'OFFLINE';
    var list = ['IDLE', 'CLAIMING', 'ACTIVE', 'ACTIVE_DEGRADED', 'REDUNDANCY_LOST', 'OFFLINE'];
    return list.map(function (s) {
      var tone = (s === 'ACTIVE') ? 'ok' : (s === 'ACTIVE_DEGRADED' ? 'warn' : (s === 'REDUNDANCY_LOST' || s === 'OFFLINE' ? 'alarm' : ''));
      var effective = cur;
      if (s === 'ACTIVE_DEGRADED' && state.degraded && cur === 'ACTIVE') effective = 'ACTIVE_DEGRADED';
      if (s === 'ACTIVE' && state.degraded && cur === 'ACTIVE') effective = 'ACTIVE_DEGRADED';
      return chip(s, effective === s, tone);
    }).join('');
  }

  function renderHeader() {
    document.getElementById('modeSel').value = state.mode;
    document.getElementById('role1Sel').value = state.plc[1].role;
    document.getElementById('role2Sel').value = state.plc[2].role;
    document.getElementById('ip1Inp').value = state.plc[1].ip;
    document.getElementById('ip2Inp').value = state.plc[2].ip;
  }

  function renderStatusStrip() {
    var bits = [];
    bits.push('<span class="pill"><span class="dot"></span>MODE <b>' + (state.mode === 'redundant' ? 'REDUNDANT PAIR' : 'STANDALONE') + '</b></span>');

    if (state.mode === 'redundant') {
      var admTone = state.admission === 'ADMITTED' ? 'ok' : (state.admission === 'CALIBRATING' ? 'warn' : 'alarm');
      bits.push('<span class="pill ' + admTone + '"><span class="dot"></span>ADMISSION <b>' + esc(state.admission) + '</b></span>');
      var permitTone = state.permitOwner ? 'ok' : 'alarm';
      bits.push('<span class="pill ' + permitTone + '"><span class="dot"></span>EXECUTION PERMIT <b>' + esc(state.permitOwner || 'WITHHELD') + '</b></span>');
      bits.push('<span class="pill"><span class="dot"></span>EPOCH <b>' + state.epoch + '</b></span>');
      var linkTone = state.link.ch1 === 'OK' && state.link.ch2 === 'OK' ? 'ok' : 'warn';
      var linkText = state.link.ch1 === 'OK' && state.link.ch2 === 'OK' ? 'HEALTHY (2/2)' :
        (linkValid() ? 'DEGRADED (1/2)' : 'LOST');
      bits.push('<span class="pill ' + linkTone + '"><span class="dot"></span>PAIR LINK <b>' + linkText + '</b></span>');
    } else {
      bits.push('<span class="pill ok"><span class="dot"></span>EXECUTION PERMIT <b>' + P1 + ' — issued at startup</b></span>');
    }

    if (state.calibration !== 'CALIBRATED' && state.mode === 'redundant') {
      bits.push('<span class="pill warn"><span class="dot"></span>CALIBRATION <b>' + esc(state.calibration) + '</b></span>');
    }
    if (state.degraded) bits.push('<span class="pill warn"><span class="dot"></span>HA_PERFORMANCE_DEGRADED</span>');
    if (state.timingLost) bits.push('<span class="pill alarm"><span class="dot"></span>HA_TIMING_GUARANTEE_LOST</span>');
    if (state.redundancyLost) bits.push('<span class="pill alarm"><span class="dot"></span>REDUNDANCY_LOST</span>');
    if (alarmsActive() === 0 && state.mode === 'redundant') bits.push('<span class="pill ok"><span class="dot"></span>ALARMS <b>none</b></span>');

    document.getElementById('statusStrip').innerHTML = bits.join('');
  }

  function renderDemoBar() {
    var redundant = state.mode === 'redundant';
    var act = activeUnit(), stb = standbyUnit();
    var canSwap = redundant && !state.busy && !state.redundancyLost &&
      act !== null && stb !== null &&
      state.sync[act] === 'SYNC_READY' && state.sync[stb] === 'SYNC_READY' &&
      state.calibration === 'CALIBRATED';
    var canDeath = redundant && !state.busy && !state.redundancyLost && act !== null;
    var canDegrade = redundant && !state.busy;
    var canCal = redundant && !state.busy;
    var html = '';
    html += '<span class="tag">Demo</span>';
    html += '<button class="primary" ' + (canSwap ? '' : 'disabled') + ' onclick="demo.manualSwap()">Manual swap (commanded)</button>';
    html += '<button class="danger" ' + (canDeath ? '' : 'disabled') + ' onclick="demo.primaryDeath()">Simulate primary death</button>';
    html += '<button class="warn" ' + (canDegrade ? '' : 'disabled') + ' onclick="demo.toggleDegrade()">' +
      (state.degraded ? 'Restore link' : 'Degrade link') + '</button>';
    html += '<button ' + (canCal ? '' : 'disabled') + ' onclick="demo.runCalibration()">Run calibration</button>';
    html += '<button ' + (state.busy ? 'disabled' : '') + ' onclick="demo.reset()">Reset</button>';
    if (state.busy) html += '<span class="hint">working…</span>';
    document.getElementById('demoBar').innerHTML = html;
  }

  function renderTabs() {
    var tabs = [
      ['overview', 'Pair Overview'],
      ['calibration', 'Calibration'],
      ['barrier', 'Ownership &amp; Barrier'],
      ['timing', 'Timing Budget'],
      ['events', 'Events']
    ];
    var html = tabs.map(function (t) {
      var active = state.tab === t[0] ? ' active' : '';
      var badge = '';
      if (t[0] === 'events' && alarmsActive() > 0) badge = '<span class="badge">' + alarmsActive() + '</span>';
      return '<button class="' + active + '" onclick="demo.tab(\'' + t[0] + '\')">' + t[1] + badge + '</button>';
    }).join('');
    document.getElementById('tabsBar').innerHTML = html;
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.toggle('active', p.id === 'panel-' + state.tab);
    });
  }

  function unitCard(unit, idx) {
    var role = state.plc[idx].role;
    var ip = state.plc[idx].ip;
    var on = state.online[unit];
    var ctl = !on ? 'OFFLINE' : state.control[unit];
    if (on && state.degraded && ctl === 'ACTIVE') ctl = 'ACTIVE_DEGRADED';
    var tr = takeoverReady(unit);

  // ---------- demo actions ----------
  function setBusy(b) { state.busy = b; renderDemoBar(); }

  async function manualSwap() {
    if (state.mode !== 'redundant' || state.busy) return;
    var act = activeUnit(), stb = standbyUnit();
    if (!act || !stb || state.sync[stb] !== 'SYNC_READY' || state.calibration !== 'CALIBRATED') {
      addEvent('warn', 'commanded swap refused: pair not SYNC_READY / not calibrated');
      renderAll();
      return;
    }
    setBusy(true);
    addEvent('info', 'haCommandedSwap received — pair SYNC_READY, calibrated');
    await sleep(500);

    // 1. old owner releases
    addEvent('info', 'RELEASE_OWNER epoch ' + state.epoch + ' (' + act + ')');
    state.modules.forEach(function (m) { m.owner = act; m.ownerState = 'SAFE'; m.armed = false; });
    state.control[act] = 'IDLE';
    state.permitOwner = null;
    state.barrier = { claimed: 0, total: state.modules.length, passed: false };
    renderAll();
    await sleep(650);

    // 2. new owner claims all, DISARMED
    state.control[stb] = 'CLAIMING';
    renderAll();
    for (var i = 0; i < state.modules.length; i++) {
      var m = state.modules[i];
      m.owner = stb;
      m.ownerState = 'CLAIMED_DISARMED';
      m.armed = false;
      m.ownerEpoch = state.epoch + 1;
      state.barrier.claimed = i + 1;
      addEvent('info', 'claim ' + m.id + ' → ' + stb + ' CLAIMED_DISARMED (' + f2(m.claim) + ' ms, ' + m.profile + ')');
      renderAll();
      await sleep(m.profile === 'reconnect' ? 420 : 130);
    }
    state.barrier.passed = true;
    addEvent('info', 'OWNERSHIP_BARRIER PASSED — all required modules CLAIMED_DISARMED');
    renderAll();
    await sleep(400);

    // 3. commit: epoch bump + ARM
    state.epoch += 1;
    state.modules.forEach(function (m) { m.ownerState = 'ARMED'; m.armed = true; m.ownerEpoch = state.epoch; });
    addEvent('info', 'ARM epoch ' + state.epoch + ' — outputs active under ' + stb);
    addEvent('info', 'COMMIT/ARM epoch ' + state.epoch + ' acknowledged by all modules');
    state.control[stb] = 'ACTIVE';
    state.permitOwner = stb;
    addEvent('info', 'CONTROL: ' + stb + ' ACTIVE; EXECUTION PERMIT → ' + stb);
    // roles exchange (commanded swap)
    var r1 = state.plc[1].role; state.plc[1].role = state.plc[2].role; state.plc[2].role = r1;
    renderAll();
    await sleep(500);

    // 4. old owner re-syncs as Secondary
    state.sync[act] = 'deSYNC';
    renderAll();
    await sleep(450);
    state.sync[act] = 'SYNCING';
    renderAll();
    await sleep(650);
    state.sync[act] = 'SYNC_READY';
    addEvent('info', 'old owner rejoined as Secondary — SYNC_READY (no automatic failback)');
    setBusy(false);
    renderAll();
  }

  async function primaryDeath() {
    if (state.mode !== 'redundant' || state.busy) return;
    var act = activeUnit(), stb = standbyUnit();
    if (!act || !stb) return;
    setBusy(true);
    state.online[act] = false;
    addEvent('warn', 'ping/pong from ' + act + ' missing — expected +1 not arriving on both channels');
    state.counters.ch1.missing += 1; state.counters.ch1.penalty += 1000;
    state.counters.ch2.missing += 1; state.counters.ch2.penalty += 1000;
    renderAll();
    await sleep(700);

    addEvent('warn', 'OwnerLease on all modules expiring — owner-age beyond confirmation window (' + f2(state.config.confirmationMs) + ' ms)');
    state.modules.forEach(function (m) { m.ownerState = 'FAILSAFE'; m.armed = false; });
    state.sync[act] = 'deSYNC';
    state.control[act] = 'IDLE';
    renderAll();
    await sleep(700);

    addEvent('alarm', act + ' declared failed — T_peer-detect confirms silence; lease expired (T_claim-start = max(peer-detection, lease expiry))');
    state.control[stb] = 'CLAIMING';
    state.barrier = { claimed: 0, total: state.modules.length, passed: false };
    renderAll();
    await sleep(400);

    for (var i = 0; i < state.modules.length; i++) {
      var m = state.modules[i];
      var ms = m.profile === 'reconnect' ? 8.40 : m.claim;
      m.owner = stb;
      m.ownerState = 'CLAIMED_DISARMED';
      m.ownerEpoch = state.epoch + 1;
      m.packetAgeUs = 120;
      state.barrier.claimed = i + 1;
      addEvent('info', 'claim ' + m.id + ' → ' + stb + ' CLAIMED_DISARMED (' + f2(ms) + ' ms, ' + m.profile + ')');
      renderAll();
      await sleep(m.profile === 'reconnect' ? 750 : 130);
    }
    state.barrier.passed = true;
    addEvent('info', 'OWNERSHIP_BARRIER PASSED');
    await sleep(350);

    state.epoch += 1;
    state.modules.forEach(function (m) { m.ownerState = 'ARMED'; m.armed = true; m.ownerEpoch = state.epoch; });
    addEvent('info', 'ARM epoch ' + state.epoch + ' — safe state released, outputs active');
    state.control[stb] = 'ACTIVE';
    state.permitOwner = stb;
    addEvent('alarm', 'takeover complete: ' + stb + ' ACTIVE epoch ' + state.epoch + ' — worst recovery ' + f2(budgetCheck().worst) + ' ms (calibrated)');
    setBusy(false);
    renderAll();
  }

  function toggleDegrade() {
    if (state.mode !== 'redundant' || state.busy) return;
    state.degraded = !state.degraded;
    if (state.degraded) {
      state.link.ch2 = 'DEGRADED';
      state.counters.ch2.missing += 1;
      state.counters.ch2.penalty += 1000;
      state.timingLost = !budgetCheck().ok ? true : false;
      addEvent('warn', 'HA_PERFORMANCE_DEGRADED — channel 2 EMA left the calibrated envelope (baseline 0.30 ms, now 1.18 ms); jitter ×3');
      if (state.timingLost) {
        addEvent('alarm', 'HA_TIMING_GUARANTEE_LOST — worst case ' + f2(budgetCheck().worst) + ' ms exceeds configured budget ' + f2(state.config.budgetMs) + ' ms');
      }
      addEvent('warn', 'one valid link remains — redundancy active, degraded path');
    } else {
      state.link.ch2 = 'OK';
      state.counters.ch2.missing = 0;
      state.counters.ch2.penalty = 0;
      state.timingLost = false;
      addEvent('info', 'channel 2 restored — inside calibrated envelope; budget check QUALIFIED (' + f2(budgetCheck().worst) + ' ms)');
    }
    renderAll();
  }

  async function runCalibration() {
    if (state.busy || state.mode !== 'redundant') return;
    setBusy(true);
    state.calibration = 'CALIBRATING';
    state.calProgress = 0;
    addEvent('info', 'commissioning calibration started — both directions under realistic worst load');
    renderAll();
    for (var pct = 0; pct <= 100; pct += 10) {
      state.calProgress = pct;
      renderCalibration();
      await sleep(110);
    }
    state.calibration = 'CALIBRATED';
    state.calBaseline = new Date().toISOString().replace('T', ' ').slice(0, 19);
    state.calTrigger = 'manual run';
    addEvent('info', 'calibration complete — HA link profile accepted (QUALIFIED)');
    setBusy(false);
    renderAll();
  }

  function invalidate(trigger) {
    if (state.busy || state.mode !== 'redundant') return;
    state.calibration = 'UNQUALIFIED';
    state.calBaseline = '—';
    state.calTrigger = trigger;
    addEvent('warn', 'qualification invalidated: ' + trigger + ' — calibration-gated readiness suspends TakeoverReady');
    renderAll();
  }

  function applyBudget() {
    var conf = parseFloat(document.getElementById('confInp').value);
    var budget = parseFloat(document.getElementById('budgetInp').value);
    if (!isFinite(conf) || conf <= 0 || !isFinite(budget) || budget <= 0) {
      addEvent('warn', 'haSetTimingBudget rejected: invalid values');
      renderAll();
      return;
    }
    state.config.confirmationMs = conf;
    state.config.budgetMs = budget;
    var bc = budgetCheck();
    if (bc.ok) {
      addEvent('info', 'haSetTimingBudget applied — confirmation ' + f2(conf) + ' ms, budget ' + f2(budget) + ' ms; QUALIFIED (worst ' + f2(bc.worst) + ' ms)');
    } else {
      addEvent('alarm', 'haSetTimingBudget refused — requirement cannot be guaranteed; minimum demonstrated budget ' + f2(bc.worst) + ' ms');
    }
    renderAll();
  }

  function onPhase(v) {
    var pct = Math.max(0, Math.min(100, Number(v)));
    state.scanPhase = pct / 100;
    var safe = document.getElementById('safeVal');
    var pred = document.getElementById('predVal');
    var lab = document.getElementById('phaseVal');
    if (safe) safe.textContent = f2((1 - state.scanPhase) * state.scan.ema10) + ' ms';
    if (pred) pred.textContent = f2(predictedNow()) + ' ms';
    if (lab) lab.textContent = Math.round(pct) + ' %';
  }

  function setMode(mode) {
    if (state.busy) return;
    state.mode = mode === 'standalone' ? 'standalone' : 'redundant';
    if (state.mode === 'standalone') {
      state.admission = 'STANDALONE';
      state.pendingStandalone = true;
      addEvent('info', 'standalone admission — permit issued at startup; redundancy statechart not running');
    } else {
      state.admission = state.calibration === 'CALIBRATED' ? 'ADMITTED' : 'UNQUALIFIED';
      addEvent('info', 'redundant mode — ping/pong discovery on port 1, pair configured');
    }
    renderAll();
  }

  function setRole(idx, role) {
    state.plc[idx].role = role === 'Primary' ? 'Primary' : 'Secondary';
    addEvent('info', 'configured role changed: ' + (idx === 1 ? P1 : P2) + ' → ' + state.plc[idx].role);
    renderAll();
  }
  function setIp(idx, ip) {
    state.plc[idx].ip = String(ip || '').trim() || state.plc[idx].ip;
    renderAll();
  }
  function setFilter(sev) {
    state.eventsFilter = sev;
    renderEvents();
  }
  function tab(name) {
    state.tab = name;
    renderTabs();
  }
  function reset() {
    if (state.busy) return;
    state = freshState();
    seedEvents();
    renderAll();
  }

  // periodic liveness: counters advance while a healthy pair link exists
  setInterval(function () {
    if (state.mode !== 'redundant' || state.busy) return;
    if (state.link.ch1 === 'OK') {
      state.counters.ch1.ping += 1;
      state.counters.ch1.pong += 1;
    }
    if (state.link.ch2 === 'OK') {
      state.counters.ch2.ping += 1;
      state.counters.ch2.pong += 1;
    }
    if (state.tab === 'overview') renderOverview();
  }, 1000);

  // expose for inline handlers
  window.demo = {
    tab: tab,
    manualSwap: function () { manualSwap(); },
    primaryDeath: function () { primaryDeath(); },
    toggleDegrade: toggleDegrade,
    runCalibration: function () { runCalibration(); },
    invalidate: invalidate,
    applyBudget: applyBudget,
    onPhase: onPhase,
    setMode: setMode,
    setRole: setRole,
    setIp: setIp,
    setFilter: setFilter,
    reset: reset
  };

  seedEvents();
  renderAll();
})();
</script>
</body>
</html>
