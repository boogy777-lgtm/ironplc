[package]
name = "ironplc-spec-requirements-gen"
description = "Build-script helper that generates spec_requirements.rs from REQ markers"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
# Duplicates workspace lints: cargo cannot inherit [lints] and override
# individual lints in the same crate.
unsafe_code = "deny"
deprecated = "deny"
warnings = "deny"

# Build-time codegen (spec requirements): panicking helpers are sanctioned here, unlike production
# compiler code where the workspace denies them.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
unreachable = "deny"
# Declared here because this table replaces the workspace one (cargo cannot
# inherit and override); `workspace_lints_guard` fails if one is missing.
disallowed_methods = "deny"
iter_over_hash_type = "deny"
dbg_macro = "deny"
mem_forget = "deny"
let_underscore_future = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
let_underscore_must_use = "deny"
