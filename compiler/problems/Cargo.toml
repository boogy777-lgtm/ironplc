[package]
name = "ironplc-problems"
description = "Generated problem messages. This crate turns a CSV file containing error descriptions into an enumeration."
version = "0.246.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[build-dependencies]
csv = "1.4"

[lints.rust]
# Duplicates workspace lints: cargo cannot inherit [lints] and override
# individual lints in the same crate.
unsafe_code = "deny"
deprecated = "deny"

# Build-time codegen (problem-codes CSV -> enum): panicking helpers are sanctioned here, unlike production
# compiler code where the workspace denies them.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"