[package]
name = "ironplc-redundancy"
description = "HA redundancy shell above the runtime host: admission owns the execution permit policy for a standalone unit or a redundant pair"
version = "0.242.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ironplc-container = { path = "../container", version = "0.242.0" }
ironplc-runtime = { path = "../runtime", version = "0.242.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
csv = "1"

[dev-dependencies]
ironplc-codegen = { path = "../codegen", version = "0.242.0" }
ironplc-dsl = { path = "../dsl", version = "0.242.0" }
ironplc-parser = { path = "../parser", version = "0.242.0" }
ironplc-project = { path = "../project", version = "0.242.0" }

[lints]
workspace = true
