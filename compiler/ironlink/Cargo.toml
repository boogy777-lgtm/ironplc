[package]
name = "ironplc-ironlink"
description = "IronLink: the workstation tool that finds IronPLC controllers on the network"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ironlink"
path = "src/main.rs"

[dependencies]
ironplc-discovery = { path = "../discovery", version = "0.247.0" }
# Only for `DEFAULT_SESSION_PORT`, which is defined once there. The crate brings
# `ironplc-vm` and `ironplc-container` with it; the constant is not worth a
# second definition.
ironplc-runtime = { path = "../runtime", version = "0.247.0" }
ironplc-cli-support = { path = "../cli-support", version = "0.247.0" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
ironplc-msg-gen = { path = "../msg_gen" }
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
rstest = "0.27"
spec_test_macro = { path = "../spec_test_macro" }

[lints]
workspace = true
