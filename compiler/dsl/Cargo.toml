[package]
name = "ironplc-dsl"
description = "Domain-specific language objects for IEC 61131 language elements. Defines the intermediate set of objects are are the output of parsing and contains the syntax tree."
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
time = "0.3.47"
ironplc-problems = { path = "../problems", version = "0.247.0" }
dsl_macro_derive = { path = "../dsl_macro_derive", version = "0.247.0" }
paste = "1.0"
regex = "1.12.3"
lazy_static = "1.5.0"

[features]
# Counts the clones of library elements (`common::library_element_clones`).
# Only the guard that no step of the analysis keeps a copy of the library
# enables it, so a product build has the derived `Clone` and no counter.
count-library-clones = []

[dev-dependencies]
rstest = "0.27"

[lints]
workspace = true
