[package]
name = "ironplc-project"
description = "Shared IronPLC project model, tokenization, and IPLC disassembly for CLI, LSP, and tooling."
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[features]
trace = ["ironplc-parser/trace"]

[dependencies]
ironplc-analyzer = { path = "../analyzer", version = "0.247.0" }
ironplc-codegen = { path = "../codegen", version = "0.247.0" }
ironplc-parser = { path = "../parser", version = "0.247.0" }
ironplc-dsl = { path = "../dsl", version = "0.247.0" }
ironplc-problems = { path = "../problems", version = "0.247.0" }
ironplc-sources = { path = "../sources", version = "0.247.0" }
ironplc-container = { path = "../container", version = "0.247.0" }
blake3 = "1"
log = "0.4.29"
serde_json = "1.0"

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
spec_test_macro = { path = "../spec_test_macro" }
# A fatal error is a category no problem code declares yet.
ironplc-dsl = { path = "../dsl", version = "0.247.0", features = ["test-support"] }
# `test-support` gives the disassembler tests the shared container fixtures.
# Dev-dependency only, so it never reaches a normal build.
ironplc-container = { path = "../container", version = "0.247.0", features = [
  "test-support",
] }
ironplc-plc2plc = { path = "../plc2plc", version = "0.247.0" }
ironplc-syntax = { path = "../syntax", version = "0.247.0" }
ironplc-test = { path = "../test", version = "0.247.0" }
tempfile = "3"
ctor = "1.0"
env_logger = "0.11"
rstest = "0.27"

[lints]
workspace = true
