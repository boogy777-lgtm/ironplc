[package]
name = "ironplc-syntax"
description = "Lossless concrete syntax tree for IEC 61131-3 text: syntax kinds, the byte-exact lexer, and the rowan tree."
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
rowan = "0.16.1"
ironplc-dsl = { path = "../dsl", version = "0.247.0" }
ironplc-problems = { path = "../problems", version = "0.247.0" }

[lints]
workspace = true

[dev-dependencies]
# Test-only: the parity tests compare against the legacy PEG parser and read
# its dialect options. It is not a production dependency of this crate.
ironplc-parser = { path = "../parser", version = "0.247.0" }
