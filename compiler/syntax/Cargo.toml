[package]
name = "ironplc-syntax"
description = "Lossless concrete syntax tree for IEC 61131-3 text: syntax kinds, the byte-exact lexer, and the rowan tree."
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
rowan = "0.16.1"
time = "0.3.47"
ironplc-dsl = { path = "../dsl", version = "0.247.0" }
ironplc-problems = { path = "../problems", version = "0.247.0" }

[lints]
workspace = true

[dev-dependencies]
ironplc-test = { path = "../test", version = "0.247.0" }
spec_test_macro = { path = "../spec_test_macro" }

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }
