[package]
name = "dsl_macro_derive"
description = "Defines macros that are used to implement the DSL"
version = "0.242.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/main.rs"

[dev-dependencies]
trybuild = "1.0"

[dependencies]
syn = { version = "3.0", features = ["extra-traits", "derive"]}
quote = "1.0"
proc-macro2 = "1.0"
convert_case = "0.12.0"

[lints.rust]
# Duplicates workspace lints: cargo cannot inherit [lints] and override
# individual lints in the same crate.
unsafe_code = "deny"
deprecated = "deny"

# Proc-macro codegen: panicking helpers are sanctioned here, unlike production
# compiler code where the workspace denies them.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"