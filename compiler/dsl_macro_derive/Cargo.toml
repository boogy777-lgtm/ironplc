[package]
name = "dsl_macro_derive"
description = "Defines macros that are used to implement the DSL"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/main.rs"

[dev-dependencies]
trybuild = "1.0"

[dependencies]
syn = { version = "3.0", features = ["extra-traits", "derive"]}
quote = "1.0"
proc-macro2 = "1.0"
convert_case = "0.12.0"

[lints.rust]
# Duplicates workspace lints: cargo cannot inherit [lints] and override
# individual lints in the same crate.
unsafe_code = "deny"
deprecated = "deny"
warnings = "deny"

# See the workspace.lints.rust comment: localized MSVC link progress trips
# rustc's linker_messages lint on rustc 1.97-1.98 (rust-lang/rust#159133).
linker_messages = "allow"

# Proc-macro codegen: panicking helpers are sanctioned here, unlike production
# compiler code where the workspace denies them.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
unreachable = "deny"
# Declared here because this table replaces the workspace one (cargo cannot
# inherit and override); `workspace_lints_guard` fails if one is missing.
disallowed_methods = "deny"
iter_over_hash_type = "deny"
dbg_macro = "deny"
mem_forget = "deny"
let_underscore_future = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
