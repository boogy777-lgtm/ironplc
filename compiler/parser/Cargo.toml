[package]
name = "ironplc-parser"
description = "Parser for IEC 61131-3 language elements. This component converts a string into the DSL objects."
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[features]
# Read the source with the front end built on the lossless tree of
# `ironplc-syntax` instead of the legacy pipeline. Off by default; see the
# `frontend` module.
cst-frontend = []
debug = ["peg/trace"]
trace = ["debug"]

[dependencies]
time = "0.3.47"
ironplc-container = { path = "../container", version = "0.247.0" }
ironplc-dsl = { path = "../dsl", version = "0.247.0" }
ironplc-problems = { path = "../problems", version = "0.247.0" }
ironplc-syntax = { path = "../syntax", version = "0.247.0" }
logos = "0.16.1"
peg = "0.8.5"

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
ironplc-test = { path = "../test", version = "0.247.0" }
rstest = "0.27"
spec_test_macro = { path = "../spec_test_macro" }

[lints]
workspace = true
