[package]
name = "ironplc-session-client"
description = "Client of the IronPLC engineering session protocol, over stdio and TCP"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The one definition of the protocol: `Command`, `Response`, the frame and the
# timeout policy.
ironplc-runtime = { path = "../runtime", version = "0.247.0" }
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
# `test-support` gives the tests the shared container fixtures. Enabling it
# here (dev-dependencies only) keeps it out of the shipped programs.
ironplc-container = { path = "../container", version = "0.247.0", features = [
  "test-support",
] }
# `workspace_binary` and `SoftDevice`: the tests start a real `ironplcvm serve`.
ironplc-test = { path = "../test", version = "0.247.0" }
rstest = "0.27"
spec_test_macro = { path = "../spec_test_macro" }
tempfile = "3"

[lints]
workspace = true
