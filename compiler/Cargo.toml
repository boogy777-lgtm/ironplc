[workspace]
members = [
    "analyzer",
    "benchmarks",
    "cli-support",
    "codegen",
    "container",
    "container_derive",
    "ironplc-cli",
    "ironplc-redundancy",
    "mcp",
    "project",
    "plc2plc",
    "dsl",
    "dsl_macro_derive",
    "parser",
    "problems",
    "runtime",
    "sources",
    "syntax",
    "spec_requirements_gen",
    "test",
    "vm",
    "vm-cli",
    "playground",
    "spec_test_macro"
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = [ "Garret Fick" ]
license = "MIT"
repository = "https://github.com/ironplc/ironplc"

# IronPLC must remain free of `unsafe` Rust. `deny` makes the compiler
# reject any `unsafe` block, fn, trait, or impl in our code. `deny`
# (rather than `forbid`) is required so that proc-macros which wrap
# unsafe internally — e.g. `ctor::ctor`, whose expansion includes
# `#[allow(unsafe_code)]` — continue to work. Per development standards,
# IronPLC code must not add `#[allow(unsafe_code)]` to bypass this.
[workspace.lints.rust]
unsafe_code = "deny"
# Denying `deprecated` turns any use of a `#[deprecated]` item into a hard
# compile error. We deprecate the compiler-located problem variants
# (`Problem::NotImplemented`, `Problem::InternalError`) so that constructing them
# directly via `Diagnostic::problem(...)` — which drops the compiler file/line the
# P9xxx dashboards rank — fails to compile. The sanctioned `Diagnostic`
# constructors opt back in with `#[expect(deprecated, reason = "...")]`.
deprecated = "deny"

# Fail on any warning (including clippy), matching CI's `-D warnings`. To make
# warnings non-fatal while iterating: `RUSTFLAGS=--cap-lints=warn cargo build`.
warnings = "deny"

# The two deny tables are complementary, not redundant — keep both in syncs:
# `warnings = "deny"` (upstream) makes every rustc/clippy warning a build
# error; this table (fork fence) elevates the five panicking constructs to
# errors even in crates and configurations where they would only warn.
# LLM fence: panicking constructs are compile errors in non-test code, not a
# prose rule. Tests keep unwrap/expect via clippy.toml (allow-*-in-tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# A result must not depend on the order a hash container yields its entries
# (see `clippy.toml`, which lists the iterating methods). Denied for the whole
# workspace so that a new crate is covered without an edit of its own.
disallowed_methods = "deny"
iter_over_hash_type = "deny"
# Debug leftovers and leaks that no test notices; none exist now, the check
# stops the first one. `large_stack_arrays` and `large_futures` guard the stack
# of a PLC target and of the controller thread.
dbg_macro = "deny"
mem_forget = "deny"
let_underscore_future = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
# `let _ = f();` drops a `Result` or another `#[must_use]` value without a
# word: the error is invisible to the user and to tests. Handle it, or state why
# ignoring is the contract with `#[expect(clippy::let_underscore_must_use, reason = "...")]`.
let_underscore_must_use = "deny"
# A suppression is `#[expect(<lint>, reason = "...")]`: `expect` fails the build
# once the suppressed finding is gone, so a suppression cannot outlive its cause,
# and the reason is what a reviewer checks.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A compiler error carries its diagnostic and a VM error its fault context, so
# both are large by design: every `Result<_, Diagnostic>` would trip this lint,
# and boxing the error would only move the allocation to every error path and
# obscure the error vocabulary.
result_large_err = "allow"

# Reduce per-binary debug-info size. `line-tables-only` retains the file/line
# tables that `cargo llvm-cov` needs to map coverage hits to source, but drops
# the type-, variable-, and inline-scope DWARF sections that dominate target/
# disk usage and link time across the test fan-out.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
